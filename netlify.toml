# Netlify configuration for the BI 255 Quarto website
[build]
  command = """
    curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.38/quarto-1.9.38-linux-amd64.tar.gz && \
    mkdir -p /tmp/quarto && \
    tar -xzf quarto-1.9.38-linux-amd64.tar.gz -C /tmp/quarto && \
    rm quarto-1.9.38-linux-amd64.tar.gz && \
    export PATH=\"/tmp/quarto/quarto-1.9.38/bin:$PATH\" && \
    quarto render
  """
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
